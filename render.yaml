services:
  - type: web
    name: Assoku
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/levels
    disk:
      name: assoku-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: GAME_DATABASE
        value: /var/data/game.sqlite3
      - key: GAME_ADMIN_PASSWORD
        generateValue: true
