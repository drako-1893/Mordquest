services:
  - type: web
    name: Assoku
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/levels
    envVars:
      - key: GAME_DATABASE_URL
        sync: false
      - key: GAME_ADMIN_PASSWORD
        generateValue: true
