<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archivo Nocturno · Niveles</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="niveles.css">
  <script src="progreso.js" defer></script>
  <script src="sesion.js" defer></script>
  <script src="niveles.js" defer></script>
</head>
<body class="levels-page">
  <main class="levels">
    <header class="levels-header">
      <div class="page-toolbar">
        <div class="toolbar-links">
          <p class="case-name">Archivo Nocturno</p>
          <a class="resource-link" href="recursos.html">Recursos</a>
        </div>
        <div class="player-session" data-player-session aria-label="Sesión"></div>
      </div>
      <h1>Selecciona un nivel</h1>
    </header>

    <p id="catalog-status" role="status">Cargando niveles…</p>
    <ol id="level-grid" class="level-grid" role="list" aria-label="Niveles"></ol>
    <template id="level-card-template">
      <li>
        <button class="level-card" type="button" aria-pressed="false">
          <span class="level-art"><span class="level-number"></span><img alt=""></span>
          <span class="level-name"></span>
          <span class="level-meta"></span>
          <span class="level-badge completed" hidden>Completado</span>
        </button>
      </li>
    </template>

    <section class="level-detail" aria-labelledby="selected-title" hidden>
      <div aria-live="polite" aria-atomic="true">
        <h2 id="selected-title"></h2>
        <p id="selected-description"></p>
      </div>
      <a id="play-level" class="level-play" href="index.html">Jugar <span aria-hidden="true">→</span></a>
    </section>
  </main>
</body>
</html>
