<main class="case" data-level-id="$level_id">
  <div class="page-toolbar">
    <nav class="toolbar-links" aria-label="Navegación">
      <a class="level-back" href="/levels">← Selección de niveles</a>
      <a class="resource-link" href="/resources">Recursos</a>
    </nav>
    $session_controls
  </div>
  <p id="level-load-status" role="status">Cargando nivel…</p>
  <div id="case-content" hidden>
    <p id="progress-notice" role="status" hidden>No se pudo confirmar el guardado del progreso.</p>
    <p id="draft-notice" role="status" hidden>No se pudieron guardar los cambios de la partida en este navegador.</p>
    $header
    <div class="workspace">
      $board
      $roster
    </div>
  </div>
</main>
$help
$result
$walkthrough
$session_dialogs
