<main class="case" data-level-id="$level_id">
  <p id="level-load-status" role="status">Cargando nivel…</p>
  <div id="case-content" hidden>
    <p id="progress-notice" role="status" hidden>No se pudo confirmar el guardado del progreso.</p>
    <p id="draft-notice" role="status" hidden>No se pudieron guardar los cambios de la partida en este navegador.</p>
    <div class="workspace-area">
      <div class="workspace">
        <div class="page-toolbar game-toolbar">
          <nav class="toolbar-links" aria-label="Navegación">
            <a class="toolbar-brand game-home" href="/levels" aria-label="Assoku, volver a los niveles">Assoku</a>
            <a class="game-levels-link" href="/levels"><span aria-hidden="true">←</span> Niveles</a>
          </nav>
          $session_controls
        </div>
        <aside class="game-sidebar" aria-label="Información y herramientas de la partida">
          $header
          <div class="controls" role="group" aria-label="Herramientas">
            <button id="cross" type="button" class="tool" aria-pressed="false" aria-label="Marca X" title="Marca X"><svg class="tool-icon" aria-hidden="true"><use href="#icon-cross"/></svg><span class="tool-label">Marca X</span></button>
            <button id="erase" type="button" class="tool" aria-pressed="false" aria-label="Borrar" title="Borrar" aria-describedby="erase-help"><svg class="tool-icon" aria-hidden="true"><use href="#icon-erase"/></svg><span class="tool-label">Borrar</span></button>
            <span id="erase-help" hidden>Mantén pulsado Borrar o usa Mayús + Intro para vaciar el plano.</span>
            <button id="undo" type="button" class="tool" aria-label="Deshacer" title="Deshacer" disabled><svg class="tool-icon" aria-hidden="true"><use href="#icon-undo"/></svg><span class="tool-label">Deshacer</span></button>
            <button id="check" type="button" class="tool check-tool" aria-label="Comprobar" title="Comprobar" disabled><svg class="tool-icon" aria-hidden="true"><use href="#icon-check"/></svg><span class="tool-label">Comprobar</span></button>
            <button id="replay" type="button" class="tool check-tool" aria-label="Volver a jugar" title="Volver a jugar" aria-haspopup="dialog" aria-controls="replay-dialog" hidden><svg class="tool-icon" aria-hidden="true"><use href="#icon-replay"/></svg><span class="tool-label">Volver a jugar</span></button>
            <button id="show-walkthrough" type="button" class="tool" aria-label="Ver solución paso a paso" title="Ver solución paso a paso" aria-haspopup="dialog" aria-controls="walkthrough-dialog"><svg class="tool-icon" aria-hidden="true"><use href="#icon-walkthrough"/></svg><span class="tool-label">Solución</span></button>
          </div>
        </aside>
        <div class="game-main">
          $board
          $roster
        </div>
      </div>
    </div>
  </div>
</main>
$help
$result
$walkthrough
$session_dialogs
