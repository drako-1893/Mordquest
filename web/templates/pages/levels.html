<main class="levels">
  <header class="levels-header">
    <div class="page-toolbar">
      <div class="toolbar-links">
        <span class="toolbar-brand">Assoku</span>
        <small class="app-release">v$app_version</small>
        <a href="/resources#personajes" data-admin-resources hidden>Recursos</a>
      </div>
      $session_controls
    </div>
    <h1>Selecciona un nivel</h1>
    <p id="level-missing" role="status"$level_missing>Ese nivel no existe. <a href="/levels">Volver a Niveles</a></p>
    <div class="catalog-controls" id="catalog-controls" hidden>
      <p class="catalog-summary">
        <span><strong id="catalog-total"></strong> niveles</span>
        <span><strong id="catalog-solved"></strong> resueltos</span>
      </p>
      <div class="catalog-difficulties" role="group" aria-label="Filtrar por dificultad">
        <button type="button" data-difficulty="all" aria-pressed="true">Todos</button>
        <button type="button" data-difficulty="very_easy" aria-pressed="false">Muy fácil</button>
        <button type="button" data-difficulty="easy" aria-pressed="false">Fácil</button>
        <button type="button" data-difficulty="medium" aria-pressed="false">Medio</button>
        <button type="button" data-difficulty="hard" aria-pressed="false">Difícil</button>
        <button type="button" data-difficulty="expert" aria-pressed="false">Experto</button>
      </div>
      <div class="catalog-options">
        <label class="catalog-order" for="level-order">Ordenar por
          <select id="level-order">
            <option value="recent">Dificultad y versión</option>
            <option value="number">Número de nivel</option>
            <option value="easy">De muy fácil a experto</option>
            <option value="hard">De experto a muy fácil</option>
            <option value="name">Nombre</option>
          </select>
        </label>
        <label class="catalog-toggle"><input type="checkbox" id="hide-completed"> Ocultar resueltos</label>
      </div>
    </div>
  </header>

  <p id="catalog-status" role="status">Cargando niveles…</p>
  <ol id="level-grid" class="level-grid" role="list" aria-label="Niveles"></ol>
  $card
</main>
$session_dialogs
