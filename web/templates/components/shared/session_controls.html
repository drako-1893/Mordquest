<div class="player-session" data-player-session aria-label="Sesión">
  <button class="theme-toggle" type="button" aria-label="Modo claro" aria-pressed="false" title="Activar modo claro">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" aria-hidden="true">
      <g class="theme-sun">
        <circle cx="12" cy="12" r="4"/>
        <path d="M12 2v2m0 16v2M2 12h2m16 0h2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4m0-14.2-1.4 1.4M6.3 17.7l-1.4 1.4"/>
      </g>
      <path class="theme-moon" d="M20.9 14a8.7 8.7 0 0 1-10.9-10.9A9 9 0 1 0 20.9 14Z"/>
    </svg>
  </button>
  <button class="player-trigger" type="button" data-player-trigger aria-label="Opciones de usuario"
    aria-expanded="false" aria-controls="player-options">
    <span class="player-avatar" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="8" r="3.25"/>
        <path d="M5.5 19v-1a6.5 6.5 0 0 1 13 0v1"/>
      </svg>
    </span>
    <span data-player-name>Invitado</span>
    <span class="player-role" data-player-role hidden>Admin</span>
    <span class="player-chevron" aria-hidden="true"></span>
  </button>
  <div class="player-options" id="player-options" hidden>
    <button type="button" data-player-customize>Personalizar</button>
    <button type="button" data-player-login>Iniciar sesión</button>
    <button type="button" data-player-logout hidden>Cerrar sesión</button>
  </div>
  <div class="session-feedback" role="status"><p data-player-status hidden></p></div>
</div>
