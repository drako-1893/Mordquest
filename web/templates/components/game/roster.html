<aside class="roster" aria-labelledby="people-title">
  <header class="section-header">
    <h2 id="people-title">Participantes</h2>
  </header>
  <section id="case-rules" class="case-rules" aria-labelledby="case-rules-title" hidden>
    <h3 id="case-rules-title">Reglas del caso</h3>
    <ul id="case-rules-list"></ul>
    <p id="seat-rule-help" hidden>Se considera asiento una silla, un banco, un puf o un sillón.</p>
  </section>
  <div id="people" class="people" role="group" aria-label="Selecciona a una persona"></div>
  <template id="person-template">
    <button type="button" class="person">
      <span class="person-identity">
        <span class="person-name"><span class="person-name-text"></span></span>
        <span class="person-group" hidden></span>
      </span>
      <span class="person-portrait">
        <span class="portrait">
          <span class="portrait-initial" aria-hidden="true"></span>
        </span>
        <span class="person-sex" role="img" hidden></span>
      </span>
      <span class="clues"></span>
      <span class="placed-indicator" hidden>
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m4 8 2.5 2.5L12 5"/></svg>
        <span class="placement-status">Ubicado</span>
      </span>
    </button>
  </template>
</aside>
