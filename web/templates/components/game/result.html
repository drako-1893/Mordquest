<dialog id="check-result" class="session-dialog check-dialog" aria-labelledby="check-title">
  <h2 id="check-title">Resultado</h2>
  <p id="check-message" role="status"></p>
  <details id="check-details" hidden>
    <summary>Ver quién está mal ubicado</summary>
    <ul id="check-misplaced"></ul>
  </details>
  <form method="dialog">
    <button id="check-close" type="submit">Cerrar</button>
  </form>
</dialog>
