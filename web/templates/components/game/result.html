<dialog id="check-result" class="session-dialog check-dialog" aria-labelledby="check-title">
  <header class="check-heading">
    <span id="check-symbol" class="check-symbol" aria-hidden="true"></span>
    <div>
      <h2 id="check-title">Resultado</h2>
      <p id="check-message" role="status"></p>
    </div>
  </header>
  <div id="check-reveal" class="check-reveal" hidden>
    <figure id="check-culprit" class="check-person">
      <div class="check-portrait" aria-hidden="true"></div>
      <figcaption>
        <span class="check-caption">Asesino</span>
        <strong></strong>
      </figcaption>
    </figure>
    <figure id="check-victim" class="check-person">
      <div class="check-portrait" aria-hidden="true"></div>
      <figcaption>
        <span class="check-caption">Víctima</span>
        <strong></strong>
      </figcaption>
    </figure>
  </div>
  <div id="check-score" class="check-score" hidden>
    <label for="check-meter" id="check-score-label"></label>
    <meter id="check-meter" min="0"></meter>
  </div>
  <details id="check-details" hidden>
    <summary>Ver quién está mal ubicado</summary>
    <ul id="check-misplaced"></ul>
  </details>
  <form method="dialog">
    <a id="check-next" class="check-next" hidden>Siguiente nivel</a>
    <button id="check-close" type="submit">Volver al tablero</button>
    <a id="check-levels" href="/levels" hidden>Volver a los niveles</a>
  </form>
</dialog>
<dialog id="replay-dialog" class="session-dialog" aria-labelledby="replay-title">
  <h2 id="replay-title">Caso resuelto</h2>
  <p>¿Quieres volver a jugar? El nuevo intento empieza con el tablero y el tiempo en cero. Tu caso sigue marcado como resuelto.</p>
  <p id="replay-status" role="status" hidden></p>
  <form method="dialog">
    <button id="replay-no" type="submit" autofocus>Conservar resuelto</button>
    <button id="replay-yes" type="button">Sí, reiniciar</button>
  </form>
</dialog>
